name: Update download button

# Keeps the "latest release" download button in README.md pointing at the most
# recent published release. Runs automatically when a release is published, and
# can be triggered by hand from the Actions tab.
on:
  release:
    types: [published]
  workflow_dispatch:

# Required so the job can push the README change back to main.
permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          # A release event checks out the tag, which would leave us detached.
          ref: main

      - name: Resolve the latest release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="$EVENT_TAG"
          if [ -z "$tag" ]; then
            # Triggered by hand: ask the API for the newest published release.
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
          fi
          if [ -z "$tag" ]; then
            echo "::notice::No published release found - nothing to update."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "Latest release: $tag"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Rewrite the download button
        if: steps.release.outputs.found == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import urllib.parse

          tag = os.environ["TAG"]
          repo = os.environ["REPO"]

          BEGIN = "<!-- BEGIN LATEST DOWNLOAD BUTTON -->"
          END = "<!-- END LATEST DOWNLOAD BUTTON -->"

          def badge_label(text):
              # Badge services read "-" and "_" as field separators, so a literal
              # one has to be doubled. Matters for tags like "v1.2-beta".
              return urllib.parse.quote(text.replace("-", "--").replace("_", "__"))

          badge = (
              f"https://custom-icon-badges.demolab.com/badge/-{badge_label('Download ' + tag)}-blue"
              "?style=for-the-badge&logo=download&logoColor=white"
          )
          link = f"https://github.com/{repo}/archive/refs/tags/{urllib.parse.quote(tag)}.zip"
          button = f'[![Download {tag}]({badge} "Download {tag} as a zip archive")]({link})'

          readme = open("README.md", encoding="utf-8").read()
          start, end = readme.find(BEGIN), readme.find(END)
          if start == -1 or end == -1:
              raise SystemExit(
                  f"README.md is missing the {BEGIN} / {END} markers - "
                  "add them back before this workflow can run."
              )

          updated = readme[: start + len(BEGIN)] + f"\n{button}\n" + readme[end:]
          if updated == readme:
              print("Button already up to date.")
          else:
              open("README.md", "w", encoding="utf-8").write(updated)
              print(f"Button updated to {tag}.")
          PY

      - name: Commit the change
        if: steps.release.outputs.found == 'true'
        uses: EndBug/add-and-commit@v9
        with:
          add: README.md
          message: "docs(readme): point download button at ${{ steps.release.outputs.tag }}"
          default_author: github_actions
